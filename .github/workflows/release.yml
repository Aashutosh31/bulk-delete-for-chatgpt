name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release (e.g. v1.0.0)
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chrome for Testing
        run: |
          OUT=$(npx --yes @puppeteer/browsers@2 install chrome@stable --path "$RUNNER_TEMP/browsers")
          echo "$OUT"
          echo "CHROME_PATH=$(echo "$OUT" | awk '{print $2}' | tail -n1)" >> "$GITHUB_ENV"

      - name: Run the full test suite
        run: npm test

      - name: Build packages
        run: npm run build

      - name: Write checksums
        run: |
          cd dist
          sha256sum *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Bulk Delete for ChatGPT ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            Download the package for your browser, then follow
            [HOW-TO-USE.md](https://github.com/Aashutosh31/bulk-delete-for-chatgpt/blob/main/HOW-TO-USE.md).

            - Firefox: `bulk-delete-for-chatgpt-firefox-<version>.zip`
              (temporary install via `about:debugging`, or sign it as an unlisted
              add-on — see [docs/PUBLISHING.md](https://github.com/Aashutosh31/bulk-delete-for-chatgpt/blob/main/docs/PUBLISHING.md))
            - Chrome / Chromium / Brave / Edge: `bulk-delete-for-chatgpt-chrome-<version>.zip`

            Verify downloads with `SHA256SUMS.txt`:

            ```bash
            sha256sum -c SHA256SUMS.txt
            ```

            The extension contacts only `chatgpt.com`, stores no tokens or chat
            titles, and deletes one conversation per request you select.
            Unofficial; not affiliated with OpenAI.
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.event.inputs.tag || github.ref_name }}
          path: dist/*
          if-no-files-found: error
